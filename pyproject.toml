[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-reader-tool"
version = "0.1.0"
description = "Read member records from a CSV file as typed Python objects, with a bundled CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["csv", "cli", "library"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/csv-reader-tool"
Issues = "https://github.com/YOUR_USERNAME/csv-reader-tool/issues"

[project.scripts]
csv-reader-tool = "csv_reader_tool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
